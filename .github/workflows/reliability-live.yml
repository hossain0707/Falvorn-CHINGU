name: CHINGU live release verification
on:
  push:
    branches: ["feature/chingu-groq-pilot"]
    paths: ["demo/reliability-browser.test.cjs", ".github/workflows/reliability-live.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node demo/smoke-live.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node demo/reliability-browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chingu-reliability-screenshots
          path: chingu-reliability-*.png
