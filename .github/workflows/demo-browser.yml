name: Public demo browser QA
on:
  push:
    branches: [main]
    paths: ["demo/**", ".github/workflows/demo-browser.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node demo/browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chingu-browser-screenshots
          path: chingu-*.png
